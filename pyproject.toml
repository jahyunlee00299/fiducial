[project]
name = "fiducial-check"
version = "0.1.0"
description = "The reference mark a measurement is aligned against. Static checks for numbers that claim to be measured: bare literals with no provenance, names that contradict their contents, declared keys nothing asserts, documents that repeat a number wrongly, and index entries pointing at artefacts that are gone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

# Deliberately empty, and a feature rather than an omission. A check that runs
# in pre-commit and inside someone else's test session must not bring a
# dependency tree with it -- the tool that reports on your parameters should
# not be the reason your environment stops resolving. Everything here is
# stdlib, including the TOML fallback for 3.10 and the block-subset YAML
# reader (differential-tested against PyYAML, 36/36 identical on a public
# corpus).
dependencies = []

keywords = [
    "static-analysis", "pre-commit", "pytest-plugin", "reproducibility",
    "provenance", "research-software", "parameters", "units",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering",
    # `Typing :: Typed` is deliberately absent. It is a promise that a type
    # checker may trust this package's annotations, and it travels with a
    # `py.typed` marker. Measured 260924: 117 of 155 functions carry a return
    # annotation. Good coverage, not a complete one -- claiming it would be
    # the same kind of unearned assurance this package exists to report.
]

[project.urls]
Homepage = "https://github.com/jahyunlee00299/fiducial"
Source = "https://github.com/jahyunlee00299/fiducial"
Issues = "https://github.com/jahyunlee00299/fiducial/issues"

[project.scripts]
fiducial = "fiducial.cli:main"

# The plugin ships in the same package. pytest discovers it through this entry
# point group with no conftest.py on the consumer's side -- installing
# fiducial is the whole setup. It stays inert unless --fiducial-spec (or a
# spec in [tool.fiducial]) names a declaration to check against, so a project
# that installs fiducial for the CLI alone sees no change in its test runs.
[project.entry-points.pytest11]
fiducial = "fiducial.pytest_plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fiducial"]

[tool.fiducial]
# fiducial checks itself. Rules (1) and (3) need a project that DECLARES
# measured quantities; this package has none of its own, so they are left out
# rather than run vacuously -- which is the same judgement the rules make.
# This repo's own workflow YAML carries no version token, so rule (2) reads it
# and can compare nothing. That now exits 2 rather than 0 -- the fix this
# dogfooding run produced -- so fiducial says out loud, about itself, that
# the check is blind here. Accepted deliberately with the setting below, which
# is exactly the decision every adopting project has to make in the open.
#
# Rules (1), (3) and (4) are absent rather than pointed at nothing: this
# package declares no measured quantities of its own and no document here
# derives its numbers from another, so running them would produce the vacuous
# pass the rules exist to refuse.
rules = ["names"]
names_paths = [".github/"]
names_allow_zero_comparable = true
locales = ["en"]
